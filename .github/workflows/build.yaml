name: Build & Smoke Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Clear local Maven cache for Jackson and Paper
        run: |
          rm -rf ~/.m2/repository/com/fasterxml || true
          rm -rf ~/.m2/repository/io/papermc/paper || true
      - name: Build
        run: mvn -B -U -DskipTests package
      - name: Smoke note
        run: echo "Smoke tests require a local Paper server; run scripts/smoke-test.sh locally to start a test server with the built plugin."

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Clear local Maven cache for Jackson and Paper
        run: |
          rm -rf ~/.m2/repository/com/fasterxml || true
          rm -rf ~/.m2/repository/io/papermc/paper || true
      - name: Build plugin
        run: mvn -B -U -DskipTests package
      - name: Download Purpur server
        run: |
          mkdir -p .server
          cd .server
          curl -Lo purpur.jar "https://api.papermc.io/v2/projects/purpur/versions/1.21.11/builds/1/downloads/purpur-1.21.11-1.jar" || true
      - name: Prepare server properties
        run: |
          cat > .server/server.properties <<EOF
          enable-rcon=true
          rcon.password=secret
          rcon.port=25575
          online-mode=false
          enable-query=true
          query.port=25565
          EOF
      - name: Copy plugin
        run: cp target/*.jar .server/plugins/ || true
      - name: Start server
        run: |
          cd .server
          nohup java -Xmx1G -jar purpur.jar --nogui > server.log 2>&1 &
          # wait for server to report finished startup (timeout 2 minutes)
          timeout=120
          while ! grep -q "Done (" server.log; do
            sleep 2
            timeout=$((timeout-2))
            if [ $timeout -le 0 ]; then
              echo "Server did not start in time"
              tail -n 200 server.log || true
              exit 1
            fi
          done
          echo "Server started"
      - name: Run connectivity check (mcstatus)
        run: |
          python3 -m pip install --user mcstatus
          ~/.local/bin/mcstatus localhost:25565 ping
      - name: Try RCON command (best effort)
        run: |
          sudo apt-get update && sudo apt-get install -y mcrcon || true
          if command -v mcrcon; then
            mcrcon -H 127.0.0.1 -P 25575 -p secret "list" || true
          else
            echo "mcrcon not available; skipped RCON check"
          fi