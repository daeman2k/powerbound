name: Build & Smoke Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build
        run: mvn -B -DskipTests package
      - name: Smoke note
        run: echo "Smoke tests require a local Paper server; run scripts/smoke-test.sh locally to start a test server with the built plugin."